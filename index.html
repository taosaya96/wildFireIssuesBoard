<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06070a">
<meta name="color-scheme" content="dark">
<title>开源，让野火蔓延至永恒</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preload" as="image" href="assets/bg-city.webp">
<link rel="preload" as="font" type="font/ttf" href="assets/wildfire-display.ttf">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas class="embers" id="embers" aria-hidden="true"></canvas>
<div class="cursor-light" id="cursorLight" aria-hidden="true"></div>

<div class="stage" id="stage" aria-hidden="true">
  <div class="slides" id="slides">
    <div class="slide slide-city is-live" data-slide="0"></div>
    <div class="slide slide-practice" data-slide="1"></div>
    <div class="slide slide-wildfire" data-slide="2"></div>
  </div>
  <div class="beam"></div>
  <div class="grade"></div>
  <div class="vignette"></div>
</div>

<main class="poster">
  <div class="frame" aria-hidden="true">
    <span class="corner c-tl"></span>
    <span class="corner c-tr"></span>
    <span class="corner c-bl"></span>
    <span class="corner c-br"></span>
    <span class="frame-notch"></span>
  </div>

  <section class="title-wrap" id="titleWrap">
    <div class="heat" aria-hidden="true"></div>
    <div class="light-streak" aria-hidden="true"></div>

    <div class="emblem" aria-hidden="true">
      <span class="emblem-rule left"></span>
      <span class="emblem-core"></span>
      <span class="emblem-rule right"></span>
    </div>

    <h1 class="title" aria-label="开源，让野火蔓延至永恒">
      <span class="eyebrow" aria-hidden="true">
        <span class="eyebrow-text"><span class="glyph" style="--i:0">开</span><span class="glyph" style="--i:1">源</span><span class="glyph glyph-comma" style="--i:2">，</span></span>
      </span>
      <span class="display" aria-hidden="true">
        <span class="part part-a"><span class="glyph" style="--i:3">让</span><span class="glyph" style="--i:4">野</span><span class="glyph" style="--i:5">火</span><span class="glyph" style="--i:6">蔓</span><span class="glyph" style="--i:7">延</span></span><span class="part part-b"><span class="glyph" style="--i:8">至</span><span class="glyph" style="--i:9">永</span><span class="glyph" style="--i:10">恒</span></span>
      </span>
    </h1>

    <div class="emberline" aria-hidden="true"></div>
  </section>

  <div class="hud" id="hud">
    <span class="hud-cap" aria-hidden="true"></span>
    <span class="hud-rail" aria-hidden="true"></span>
    <div class="hud-dots" id="dots" role="group" aria-label="背景切换">
      <button class="hexdot is-live" type="button" data-go="0" aria-label="城市"></button>
      <button class="hexdot" type="button" data-go="1" aria-label="训练场"></button>
      <button class="hexdot" type="button" data-go="2" aria-label="野火"></button>
    </div>
  </div>
</main>

<div class="grain" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"></div>
<div class="curtain" id="curtain" aria-hidden="true"></div>

<script src="main.js"></script>
</body>
</html>
