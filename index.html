<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --border: #262b3a;
    --text: #e6e8ee; --dim: #8b93a7;
    --red: #f0564a; --amber: #e6a23c; --green: #4caf7d; --blue: #5b9df9; --gray: #6b7280;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,'Microsoft YaHei',sans-serif; padding:24px; }
  h1 { font-size:22px; margin-bottom:4px; display:flex; align-items:center; gap:10px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:20px; }
  .stats { display:flex; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .stat { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px 16px; }
  .stat b { font-size:20px; display:block; }
  .stat span { font-size:12px; color:var(--dim); }
  .stat.red b { color:var(--red); } .stat.green b { color:var(--green); } .stat.amber b { color:var(--amber); } .stat.gray b { color:var(--gray); } .stat.blue b { color:var(--blue); }
  h2 { font-size:16px; margin:20px 0 10px; color:var(--dim); border-left:3px solid var(--blue); padding-left:8px; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border-radius:8px; overflow:hidden; }
  th { background:#1d2130; color:var(--dim); font-size:12px; text-align:left; padding:8px 10px; }
  th.th-sort { cursor:pointer; user-select:none; white-space:nowrap; }
  th.th-sort:hover { color:var(--blue); }
  td { padding:8px 10px; border-top:1px solid var(--border); font-size:13px; vertical-align:top; }
  tr:hover td { background:#1b1f2c; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; white-space:nowrap; }
  .b-todo { background:#262b3a; color:var(--gray); }
  .b-idea { background:#1d2a45; color:var(--blue); }
  .b-doing { background:#3a2d14; color:var(--amber); }
  .b-stuck { background:#3a1d1a; color:var(--red); }
  .b-retest { background:#1d3a2a; color:var(--green); }
  .b-done { background:#1d2a22; color:var(--green); }
  .b-drop { background:#262b3a; color:var(--gray); }
  .b-p0 { background:#5c1f1a; color:#ff8a7a; }
  .b-p1 { background:#3a2d14; color:var(--amber); }
  .b-p2 { background:#262b3a; color:var(--gray); }
  .commit { font-family:monospace; font-size:11px; color:var(--blue); }
  .hero-tag { background:#262b3a; padding:1px 6px; border-radius:6px; font-size:11px; }
  .note { color:var(--dim); font-size:12px; }
  .footer { margin-top:30px; color:var(--dim); font-size:12px; text-align:center; }
  .refresh { float:right; font-size:12px; color:var(--blue); cursor:pointer; border:1px solid var(--border); background:var(--panel); padding:4px 12px; border-radius:6px; }
  .refresh:hover { background:#1d2130; }
</style>
</head>

function badge(status) {
  const map = {todo:'还没做', idea:'有思路', doing:'正在开发', stuck:'卡住了等会', retest:'待复测', done:'已修复', drop:'已放弃'};
  const cls = {todo:'b-todo', idea:'b-idea', doing:'b-doing', stuck:'b-stuck', retest:'b-retest', done:'b-done', drop:'b-drop'};
  return '<span class="badge ' + (cls[status]||'b-todo') + '">' + (map[status]||'还没做') + '</span>';
}

// ===== 排序 =====
// key: id | hero | hid | skill ; dir: 1 升序, -1 降序
let sortState = { key: 'pri', dir: 1 };

function _heroHid(r) { return parseInt(r.hid) || 0; }

function _cmp(a, b, key) {
  if (key === 'hero') return String(a.hero||'').localeCompare(String(b.hero||''), 'zh-Hans-CN') || (_heroHid(a) - _heroHid(b));
  if (key === 'hid') return _heroHid(a) - _heroHid(b);
  if (key === 'pri') return (a.pri == null ? 9 : a.pri) - (b.pri == null ? 9 : b.pri);
  if (key === 'skill') return String(a.skill||'').localeCompare(String(b.skill||''), 'zh-Hans-CN');
  if (key === 'req') return String(a.req||'').localeCompare(String(b.req||''), 'zh-Hans-CN') || _reqId(a) - _reqId(b);
  if (key === 'id') {
    const na = _reqId(a), nb = _reqId(b);
    return na - nb;
  }
  return (a.id || 0) - (b.id || 0);
}

function _reqId(r) {
  if (r.id == null) return 0;
  const n = parseInt(String(r.id).replace(/\D/g, ''), 10);
  return isNaN(n) ? 0 : n;
}

function sortRows(list) {
  const arr = list.slice();
  arr.sort(function(a, b) { return _cmp(a, b, sortState.key) * sortState.dir; });
  return arr;
}

function setSort(key) {
  if (sortState.key === key) { sortState.dir = -sortState.dir; }
  else { sortState.key = key; sortState.dir = 1; }
  render();
}

function thSort(key, label) {
  const arrow = sortState.key === key ? (sortState.dir === 1 ? ' ▲' : ' ▼') : ' ⇅';
  return '<th class="th-sort" onclick="setSort(\'' + key + '\')" title="点击排序">' + label + arrow + '</th>';
}

function priBadge(p) {
  const map = {0:'P0', 1:'P1', 2:'P2'};
  const cls = {0:'b-p0', 1:'b-p1', 2:'b-p2'};
  return '<span class="badge ' + (cls[p]||'b-p2') + '">' + (map[p]||'P2') + '</span>';
}

function render() {

    '<div class="stat green"><b>' + BOARD.done.length + '</b><span>已修复</span></div>' +
    '<div class="stat gray"><b>' + BOARD.drop.length + '</b><span>已放弃</span></div>';

  const b = document.getElementById('board');
  let html = '<h2>需求（新功能）（' + BOARD.req.length + '）</h2>';
  html += '<table><tr>' + thSort('id', '#') + thSort('req', '需求') + '<th>描述</th><th>状态</th><th>备注</th></tr>';
  sortRows(BOARD.req).forEach(r => {
    html += '<tr><td>' + r.id + '</td><td><b>' + r.req + '</b></td><td>' + r.desc + '</td>' +
      '<td>' + badge(r.st || 'todo') + '</td><td class="note">' + (r.note||'') + '</td></tr>';
  });
  html += '</table>';

  html += '<h2>未修复问题（' + BOARD.open.length + '）</h2>';
  html += '<table><tr>' + thSort('pri', '优先') + thSort('id', '#') + thSort('hero', '英雄') + thSort('skill', '技能') + '<th>现象</th><th>状态</th><th>备注</th></tr>';
  sortRows(BOARD.open).forEach(r => {
    html += '<tr><td>' + priBadge(r.pri) + '</td><td>' + r.id + '</td><td>' + r.hero + ' <span class="hero-tag">' + r.hid + '</span></td>' +
      '<td><b>' + r.skill + '</b></td><td>' + r.desc + '</td>' +
      '<td>' + badge(r.st || 'todo') + '</td><td class="note">' + (r.note||'') + '</td></tr>';
  });
  html += '</table>';

  html += '<h2>已修复（' + BOARD.done.length + '）</h2>';
  html += '<table><tr>' + thSort('hero', '英雄') + thSort('skill', '技能') + '<th>现象</th><th>修复</th><th>提交</th><th>完成时间</th></tr>';
  sortRows(BOARD.done).forEach(r => {
    html += '<tr><td>' + r.hero + (r.hid?' <span class="hero-tag">'+r.hid+'</span>':'') + '</td>' +
      '<td><b>' + r.skill + '</b></td><td>' + r.desc + '</td><td>' + r.fix + '</td>' +
      '<td class="commit">' + (r.commit||'') + '</td>' +
      '<td class="note">' + (r.time||'') + '</td></tr>';
  });
  html += '</table>';

  html += '<h2>已放弃（' + BOARD.drop.length + '）</h2>';
  html += '<table><tr>' + thSort('hero', '英雄') + thSort('skill', '技能') + '<th>现象</th><th>原因</th></tr>';
  sortRows(BOARD.drop).forEach(r => {
    html += '<tr><td>' + r.hero + ' <span class="hero-tag">' + r.hid + '</span></td>' +
      '<td><b>' + r.skill + '</b></td><td>' + r.desc + '</td><td class="note">' + r.reason + '</td></tr>';
  });
  html += '</table>';

  b.innerHTML = html;
}
render();
</script>
</body>
</html>
